<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>EMPIRE ZERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- فونت بدون بلاک‌کردن رندر: اگه گوگل فونت فیلتر/کند بود، صفحه با فونت سیستم همون لحظه بالا میاد -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"></noscript>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#050506; --bg2:#0a0a0d; --card:#0e0f13; --card2:#14151a; --line:#1e2027; --line2:#2a2d36;
  --red:#e02a2a; --red2:#a81414; --amber:#f5a30f; --amber2:#c97c00; --txt:#f3f3f5; --dim:#8c909a;
  --green:#2fd27a; --blue:#2f6bff; --teal:#19c3b0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --hdr:62px; --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#2a0707 0%,transparent 55%),var(--bg)}
/* header */
header{flex:none;height:calc(var(--hdr) + var(--sat));padding:var(--sat) 14px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #15161b;background:rgba(5,5,6,.82);backdrop-filter:blur(10px);z-index:20}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:#17181d;border:2px solid #c7501f;box-shadow:0 0 14px rgba(224,42,42,.35);flex:none}
.who small{display:block;color:var(--dim);font-size:11px}
.who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.pill{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--green);background:rgba(47,210,122,.08);border:1px solid rgba(47,210,122,.28)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(47,210,122,.7);animation:pulse 1.8s infinite}
.pill.off{color:var(--amber);background:rgba(245,163,15,.08);border-color:rgba(245,163,15,.3)}
.pill.off i{background:var(--amber);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(47,210,122,0)}100%{box-shadow:0 0 0 0 rgba(47,210,122,0)}}
/* tabs */
main{flex:1;position:relative;min-height:0}
.tab{position:absolute;inset:0;display:none}
.tab.on{display:block}
.scroll{overflow-y:auto;overflow-x:hidden;padding:14px 14px calc(var(--nav) + var(--sab) + 18px);-webkit-overflow-scrolling:touch}
nav{flex:none;height:calc(var(--nav) + var(--sab));padding:6px 10px var(--sab);display:flex;gap:4px;background:rgba(8,8,10,.92);backdrop-filter:blur(12px);border-top:1px solid #17181d;z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;color:var(--dim);font-size:11px;font-weight:600;transition:.2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:linear-gradient(180deg,rgba(224,42,42,.22),rgba(224,42,42,.06));box-shadow:inset 0 0 0 1px rgba(224,42,42,.35)}
/* map */
#t-map{background:radial-gradient(120% 90% at 50% 40%,#0b1a33 0%,#050a16 62%,#02040a 100%);overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab;outline:none}
#cv:active{cursor:grabbing}
#lbl{position:absolute;inset:0;pointer-events:none;overflow:hidden;contain:strict}
.lb{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform;opacity:0;transition:opacity .25s;pointer-events:none}
.lb.on{opacity:1}
.lb .bd{position:relative;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1;background:rgba(6,8,14,.82);border:2px solid var(--c,#fff);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 3px 10px rgba(0,0,0,.5),0 0 12px var(--c,#fff)}
.lb b{font-size:11px;font-weight:800;color:#fff;white-space:nowrap;text-shadow:0 0 3px #000,0 0 6px #000,0 1px 2px #000;letter-spacing:-.1px}
.lb .cr{position:absolute;top:-17px;left:50%;margin-left:-9px;font-size:18px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.lb.me .bd{border-color:#ff4a4a;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 16px #ff3b3b}
.lb.me .bd::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid rgba(255,74,74,.85);animation:ping 1.7s ease-out infinite}
@keyframes ping{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.7);opacity:0}}
.lb .you{position:absolute;top:-19px;left:50%;transform:translateX(-50%);padding:1px 7px;border-radius:7px;background:#e0282f;border:1.5px solid #fff;font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap}
.lb.sm .bd{width:20px;height:20px;font-size:11px;border-width:1.5px}
.lb.sm b{display:none}
.ticker{position:absolute;top:10px;left:10px;right:10px;height:38px;border-radius:12px;background:rgba(8,8,10,.72);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;padding:0 12px;overflow:hidden;font-size:12.5px;z-index:5}
.ticker .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ticker span.in{animation:slide .5s ease}
@keyframes slide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ctl{position:absolute;left:10px;top:60px;display:flex;flex-direction:column;gap:8px;z-index:5}
.ctl button{width:42px;height:42px;border-radius:12px;background:rgba(8,8,10,.74);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;font-size:20px;font-weight:800}
.ctl button:active{transform:scale(.94)}
.chips{position:absolute;right:10px;left:10px;bottom:calc(10px);display:flex;gap:8px;overflow-x:auto;z-index:5;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:13px;background:rgba(8,8,10,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);font-size:12.5px;font-weight:600}
.chip.gold{border-color:rgba(255,205,60,.5);box-shadow:0 0 16px rgba(255,205,60,.15)}
.chip.red{border-color:rgba(224,42,42,.5)}
.stat{position:absolute;right:10px;top:60px;z-index:5;padding:8px 11px;border-radius:12px;background:rgba(8,8,10,.74);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);font-size:11.5px;line-height:1.7;color:#cfd3dc}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:13px;z-index:4;background:radial-gradient(120% 90% at 50% 40%,#0b1a33 0%,#050a16 62%,#02040a 100%);text-align:center;transition:opacity .5s}
.loading.out{opacity:0;pointer-events:none}
.loading b{display:block;width:34px;height:34px;margin:0 auto 12px;border-radius:50%;border:3px solid #1b2c3d;border-top-color:var(--red);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* shop */
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}
.sec h3{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.sec small{color:var(--dim);font-size:11px}
.sec .dotA{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.wallet{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.wal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;min-width:0}
.wal small{display:block;color:var(--dim);font-size:10.5px;margin-bottom:3px}
.wal b{font-size:13.5px;display:block;white-space:nowrap}
.wal em{display:block;font-style:normal;font-size:9.5px;color:var(--dim);margin-top:2px}
.wal.z b{color:var(--amber)}
.shieldbar{margin-top:8px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px}
.shieldbar svg{width:22px;height:22px;flex:none}
.shieldbar .t{flex:1;color:var(--dim)}
.shieldbar b{color:#7fb0ff}
.banner{position:relative;height:186px;border-radius:20px;overflow:hidden;border:1px solid #2a1214;background:linear-gradient(100deg,#0b0405 0%,#2a0608 100%)}
.slide{position:absolute;inset:0;padding:16px 20px 46px;display:flex;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:opacity .5s}
.slide.on{opacity:1;pointer-events:auto}
.slide .tx{max-width:62%}
.slide .bd{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:10.5px;font-weight:600;color:var(--amber);background:rgba(245,163,15,.1);border:1px solid rgba(245,163,15,.4)}
.slide h2{margin:9px 0 11px;font-size:19px;line-height:1.5;font-weight:800}
.slide h2 em{font-style:normal;color:#ff4747}
.btnR{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:12px;font-weight:700;font-size:12.5px;background:linear-gradient(180deg,#ef3b3b,#b81a1a);box-shadow:0 6px 18px rgba(224,42,42,.35);color:#fff}
.btnR:active{transform:scale(.97)}
.slide .art{width:96px;height:96px;filter:drop-shadow(0 0 22px rgba(224,42,42,.55));flex:none}
.bnav{position:absolute;bottom:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;z-index:3;font-size:15px}
.bnav.l{left:12px}.bnav.r{right:12px}
.dots{position:absolute;bottom:17px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:3px;background:#444;transition:.3s}
.dots i.on{width:22px;background:var(--red)}
.cats{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:76px;height:84px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:600;color:#c3c6ce;transition:.2s}
.cat svg{width:30px;height:30px}
.cat.on{background:linear-gradient(180deg,#ef3b3b,#a81414);color:#fff;border-color:#ff5a5a;box-shadow:0 8px 24px rgba(224,42,42,.4)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rec{display:flex;align-items:center;gap:9px;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0}
.rec .ic{width:38px;height:38px;border-radius:11px;background:#0d1426;display:grid;place-items:center;flex:none}
.rec .ic svg{width:26px;height:26px}
.rec .i{flex:1;min-width:0}
.rec b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rb{width:30px;height:30px;border-radius:50%;background:rgba(224,42,42,.12);border:1px solid rgba(224,42,42,.45);display:grid;place-items:center;flex:none}
.rec .rb svg{width:15px;height:15px;stroke:#ff5555;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.offer{position:relative;display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;border:1px solid rgba(245,163,15,.38);background:linear-gradient(120deg,rgba(245,163,15,.1),rgba(20,14,4,.9));margin-bottom:9px}
.offer .ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.04);display:grid;place-items:center;flex:none}
.offer .ic svg{width:36px;height:36px}
.offer .i{flex:1;min-width:0}
.tagA{display:inline-block;padding:2px 8px;border-radius:7px;background:var(--amber);color:#1a1000;font-size:10.5px;font-weight:800;margin-bottom:4px}
.offer b{display:block;font-size:14px}
.offer .pr{font-size:12px;margin-top:3px;color:#ffd27a}
.offer .pr s{color:var(--dim);margin-left:6px}
.offer .cd{font-size:10.5px;color:var(--amber);margin-top:4px}
.btnA{padding:10px 20px;border-radius:12px;font-weight:800;font-size:13px;background:linear-gradient(180deg,#ffb52a,#e28c00);color:#1a1000;box-shadow:0 6px 16px rgba(245,163,15,.25)}
.btnA:active{transform:scale(.96)}
.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line)}
.item .ic{height:70px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.07),transparent 70%),#0a0b0f}
.item .ic svg{width:48px;height:48px}
.item b{font-size:13.5px}
.item small{color:var(--dim);font-size:10.5px;line-height:1.5;min-height:31px}
.price{display:flex;align-items:center;justify-content:space-between;gap:6px}
.price span{font-weight:800;font-size:13px}
.price span.z{color:var(--amber)}
.btnS{padding:7px 14px;border-radius:10px;font-weight:700;font-size:12px;background:linear-gradient(180deg,#ef3b3b,#b81a1a);color:#fff}
.btnS.dis{background:#1b1c22;color:var(--dim)}
.empty{padding:26px 14px;text-align:center;color:var(--dim);font-size:12.5px;border:1px dashed var(--line2);border-radius:16px}
/* rank */
.seg{display:flex;padding:4px;border-radius:13px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.seg button{flex:1;padding:8px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--dim)}
.seg button.on{background:linear-gradient(180deg,#ef3b3b,#a81414);color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:7px}
.row.me{border-color:rgba(224,42,42,.7);background:linear-gradient(90deg,rgba(224,42,42,.12),var(--card))}
.row.up{animation:rowup 1.6s}
.row.dn{animation:rowdn 1.6s}
@keyframes rowup{0%{background:rgba(47,210,122,.3)}100%{background:var(--card)}}
@keyframes rowdn{0%{background:rgba(224,42,42,.3)}100%{background:var(--card)}}
.rk{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:#17181d;flex:none}
.rk.g1{background:linear-gradient(180deg,#ffd75e,#c98f00);color:#2a1c00}
.rk.g2{background:linear-gradient(180deg,#e3e6ee,#9aa0ae);color:#1b1d24}
.rk.g3{background:linear-gradient(180deg,#e3a06b,#a15b24);color:#2a1300}
.cdot{width:10px;height:10px;border-radius:50%;flex:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--dim);font-size:10.5px}
.row .v{text-align:left;font-weight:800;font-size:13.5px}
.row .v small{display:block;color:var(--dim);font-weight:400;font-size:10px}
.mv{font-size:10px;font-weight:700;margin-right:4px}
.mv.u{color:var(--green)}.mv.d{color:#ff6b6b}
/* me */
.hero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:linear-gradient(120deg,#220707,#0d0d11);border:1px solid #3a1416}
.hero .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#17181d;border:2px solid #c7501f;box-shadow:0 0 22px rgba(224,42,42,.4)}
.hero h2{margin:0 0 4px;font-size:18px}
.hero small{color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.sc{padding:13px;border-radius:15px;background:var(--card);border:1px solid var(--line)}
.sc small{display:block;color:var(--dim);font-size:11px;margin-bottom:4px}
.sc b{font-size:18px}
.bar{height:6px;border-radius:3px;background:#1b1c22;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ef3b3b,#ff8a3d)}
.bar i.b{background:linear-gradient(90deg,#2f6bff,#6fa0ff)}
.crownCard{margin-top:10px;padding:13px;border-radius:15px;background:linear-gradient(120deg,rgba(255,205,60,.12),var(--card));border:1px solid rgba(255,205,60,.4);font-size:12.5px;line-height:1.8}
/* sheet + toast */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.25s;z-index:40}
#shade.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;padding:10px 16px calc(18px + var(--sab));border-radius:24px 24px 0 0;background:#0d0e12;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:41}
#sheet.on{transform:none}
#sheet .grab{width:42px;height:4px;border-radius:2px;background:#33353e;margin:0 auto 14px}
#sheet h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
#sheet p{color:var(--dim);font-size:12.5px;line-height:1.8;margin:6px 0}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.kv div{padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center}
.kv small{display:block;color:var(--dim);font-size:10.5px;margin-bottom:3px}
.kv b{font-size:14px}
.acts{display:flex;gap:9px;margin-top:14px}
.acts button{flex:1;padding:13px;border-radius:13px;font-weight:800;font-size:13.5px}
.acts .ok{background:linear-gradient(180deg,#ef3b3b,#b81a1a);color:#fff}
.acts .no{background:var(--card2);border:1px solid var(--line2);color:#c3c6ce}
.news li{list-style:none;padding:9px 0;border-bottom:1px solid #16171c;font-size:12.5px;line-height:1.7}
.news li small{color:var(--dim);display:block;font-size:10.5px}
.news{padding:0;margin:8px 0 0}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 70px);transform:translate(-50%,-20px);opacity:0;padding:11px 16px;border-radius:13px;background:#14151a;border:1px solid var(--line2);font-size:13px;font-weight:600;z-index:60;max-width:88vw;text-align:center;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.good{border-color:rgba(47,210,122,.6);box-shadow:0 0 24px rgba(47,210,122,.18)}
#toast.bad{border-color:rgba(224,42,42,.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#fx2{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ctl button.on{border-color:rgba(255,205,60,.75);box-shadow:0 0 16px rgba(255,205,60,.35)}
#sheet input.q{width:100%;padding:12px 14px;margin:10px 0;border-radius:13px;border:1px solid var(--line2);background:var(--card);color:var(--txt);font:inherit;font-size:14px;outline:none}
#sheet .ql{max-height:46vh;overflow-y:auto}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

#ifdef DERIV

  /* بافت ریز: خاک و درختان */
  float grain=0.5;float trees=0.5;
  if(near>0.02){grain=n3(N*ws*70.0);trees=n3(N*ws*210.0);}
  bio*=0.86+0.30*grain;
  bio*=1.0-0.20*near*smoothstep(0.30,0.80,moist)*(0.4+0.6*trees);
  vec3 rock=mix(vec3(0.36,0.31,0.28),vec3(0.58,0.52,0.45),nC);

  float snowLine=0.98-0.52*(1.0-temp);

  tc=mix(tc,vec3(0.82,0.76,0.56),(1.0-smoothstep(0.47,0.55,cv))*0.60);   /* ساحل شنی */
  float ao=mix(0.74,1.0,smoothstep(0.02,0.40,ee))*(1.0-0.28*steep);
  vec3 lc=tc*(0.46+0.54*shade)*ao;

  /* ===== سرزمین کشورها ===== */
  float e_px=1000.0;float diff=0.0;vec3 pc=vec3(1.0);float isSel=0.0;float isCrown=0.0;float isMe=0.0;
  if(cLand>0.5){
    float ang=atan(dl.y,dl.x);

    vec4 nd=cellTex(nbOf(h,j));
    float no=ownerOf(nd);
    float ein=0.8660254-max(abs(dl.x),0.5*abs(dl.x)+0.8660254*abs(dl.y));
    e_px=max(ein,0.0)*hexPx;
    if(o>-0.5){
      pc=texture2D(tPal,vec2((o+0.5)/uPalW,0.5)).rgb;
      isSel=1.0-step(0.5,abs(o-uSel));isCrown=1.0-step(0.5,abs(o-uCrown));isMe=1.0-step(0.5,abs(o-uMe));

    }
  }
  float sc=clamp(hexPx/11.0,0.45,1.0);
  float dark=diff*(1.0-smoothstep(0.6*sc,1.7*sc,e_px));
  float lite=diff*smoothstep(0.7*sc,1.7*sc,e_px)*(1.0-smoothstep(2.8*sc,4.6*sc,e_px));
  float glow=diff*(1.0-smoothstep(0.0,13.0*sc,e_px));
  float pulse=0.5+0.5*sin(uTime*2.4);
  vec3 lineC=min(pc*1.30+0.12,vec3(1.0));
  lineC=mix(lineC,vec3(1.0,0.82,0.25),isCrown*(0.75+0.25*pulse));
  lineC=mix(lineC,vec3(1.0),isSel);
  lc=mix(lc,vec3(0.02,0.03,0.06),dark*0.85);

  float gridA=smoothstep(13.0,38.0,hexPx)*0.16*cLand;
  lc=mix(lc,vec3(0.0,0.02,0.04),gridA*(1.0-smoothstep(0.35,1.15,e_px)));
  float fx=texture2D(tFx,(h+0.5)/uGrid).r;
  lc=mix(lc,vec3(1.0,0.93,0.72),fx*0.9);

  /* ===== اقیانوس ===== */
  float depth=sm.b;
  vec3 oc=mix(vec3(0.004,0.04,0.13),vec3(0.01,0.18,0.36),smoothstep(0.0,0.34,depth));
  oc=mix(oc,vec3(0.04,0.50,0.60),smoothstep(0.30,0.80,depth)*0.95);
  float shore=smoothstep(0.30,0.46,cv)*(1.0-land);
  oc=mix(oc,vec3(0.30,0.78,0.72),shore*0.55);
  oc*=0.88+0.26*n3(N*ws*4.0+vec3(2.0,7.0,1.0));
  float fmw=ws*48.0;float wst=max(0.0016,ds*1.2);
  vec3 Nr=N;
  if(near>0.02&&land<0.98){
    float t=uTime*0.35;
    vec3 q0=N*fmw+vec3(t,0.0,t*0.7);
    float a0=n3(q0)*0.7+n3(q0*2.3+vec3(0.0,t,0.0))*0.3;

  float ice=smoothstep(0.86,0.93,latn+(iceN-0.5)*0.12)*(1.0-land);
  oc=mix(oc,vec3(0.82,0.90,0.96)*(0.85+0.15*iceN),ice);
  vec2 gld=abs(fract(vec2(lon,lat)/(PI/12.0)+0.5)-0.5)*(PI/12.0);
  float gl=1.0-smoothstep(ds*0.4,ds*1.5,min(gld.x*max(cos(lat),0.05),gld.y));
  oc+=vec3(0.30,0.60,1.0)*gl*0.04*(1.0-smoothstep(10.0,22.0,hexPx));

  float cfS=1.0-smoothstep(5.0,14.0,hexPx);
  /* سایه‌ی ابر روی زمین و دریا */
  float clv=0.0;

    lc*=1.0-0.22*clv*cfS;oc*=1.0-0.20*clv*cfS;
  }
  vec3 col=mix(oc,lc,land);

  vec3 V=normalize(uCam-vP);
  float ndl=dot(N,uLight);
  float lit=0.58+0.54*smoothstep(-0.35,0.85,ndl);
  float sd=dot(N,uSun);float dayF=smoothstep(-0.12,0.30,sd);
  lit=mix(lit,0.26+0.86*dayF,uNight);
  col*=lit;
  float owned=step(-0.5,o)*cLand*land;
  /* چراغ شهرها: نقطه‌های ریز + درخشش کشور */

  /* ابرها */
  if(cfS>0.002){
    float cl=clv;

    vec3 cc=mix(vec3(0.62,0.68,0.78),vec3(1.0),smoothstep(-0.2,0.6,dot(N,Ls)))*(0.5+0.5*lit);

  float au=smoothstep(0.76,0.86,latn)*(1.0-smoothstep(0.90,0.98,latn));
  float aun=n3(vec3(lon*9.0,latn*46.0-uTime*0.35,uTime*0.18))*n3(vec3(lon*3.0+4.0,latn*12.0,uTime*0.07));

/* ---- ساخت داده‌ی زمین (یک‌بار برای هر اندازه‌ی نقشه) ---- */
function boxBlur(src,w,h,r){
  const t=new Float32Array(w*h),o=new Float32Array(w*h),k=1/(2*r+1);
  for(let y=0;y<h;y++){let s=0;const b=y*w;for(let x=-r;x<=r;x++)s+=src[b+clampv(x,0,w-1)];
    for(let x=0;x<w;x++){t[b+x]=s*k;s+=src[b+Math.min(w-1,x+r+1)]-src[b+Math.max(0,x-r)]}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[clampv(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){o[y*w+x]=s*k;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x]}}
  return o;
}
function blurN(a,w,h,r,n){for(let i=0;i<n;i++)a=boxBlur(a,w,h,r);return a}
function buildGeo(g){
  S.geo=g;const W=g.W,H=g.H,n=g.cells.length,N=W*H;
  M.li=new Int32Array(N).fill(-1);g.cells.forEach((c,i)=>{M.li[c]=i});
  const hasEv=typeof g.ev==='string'&&g.ev.length===n,bandV=[.11,.34,.58,.85];
  const elv=new Float32Array(N);
  for(let i=0;i<n;i++)elv[g.cells[i]]=hasEv?(+g.ev[i]+.5)/10:bandV[+g.elev[i]||0];
  M.elv=elv;

  M.cd=new Uint8Array(N*4);for(let i=0;i<n;i++){const c=g.cells[i];M.cd[c*4+2]=Math.round(elv[c]*255);M.cd[c*4+3]=255}

  const ww=worldW(),wh=worldH(),GW=Math.min(1536,Math.round(W*7)),GH=Math.max(8,Math.round(GW*wh/ww));
  const L=new Float32Array(GW*GH),E=new Float32Array(GW*GH);
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){
    const [q,r]=hexAt((gx+.5)/GW*ww,(gy+.5)/GH*wh);
    if(q>=0&&r>=0&&q<W&&r<H&&M.li[r*W+q]>=0){const k=gy*GW+gx;L[k]=1;E[k]=elv[r*W+q]}}

  M.sm={w:GW,h:GH,data};

}

  <div class="sec"><h3>فروشگاه</h3><small>${fa(list.length)} آیتم</small></div>
  <div class="items">${list.map(i=>`<div class="item"><div class="ic">${art(i.cat)}</div><b>${esc(i.title)}</b><small>${esc(i.sub)}</small><div class="price"><span class="${i.cur==='zero'?'z':''}">${priceTx(i)}</span><button class="btnS ${canPay(i)?'':'dis'}" data-buy="${i.id}">خرید</button></div></div>`).join('')}</div>`;
  $$('[data-cat]',el).forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;renderShop();el.scrollTo({top:el.scrollHeight*.35,behavior:'smooth'})});
  $$('[data-c]',el).forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;renderShop();hap()});
  $$('[data-buy]',el).forEach(b=>b.onclick=()=>confirmBuy(b.dataset.buy));
  $$('[data-re]',el).forEach(b=>b.onclick=()=>confirmBuy(b.dataset.re));
  $$('[data-d]',el).forEach(b=>b.onclick=()=>{bannerI=(bannerI+ +b.dataset.d+SLIDES.length)%SLIDES.length;setBanner()});
  $$('.slide',el).forEach(s=>0);
}
function setBanner(){$$('#bn .slide').forEach((s,i)=>s.classList.toggle('on',i===bannerI));$$('#bn .dots i').forEach((s,i)=>s.classList.toggle('on',i===bannerI))}
clearInterval(bannerT);bannerT=setInterval(()=>{if(S.tab==='shop'&&$('#bn')){bannerI=(bannerI+1)%SLIDES.length;setBanner()}},5200);
setInterval(()=>{$$('.cd').forEach(e=>e.textContent='⏳ '+dur(+e.dataset.end-Date.now()/1000)+' مانده')},30000);
function confirmBuy(id){
  const it=[...S.shop.items,...S.shop.offers].find(x=>x.id===id)||S.shop.items.find(x=>x.id===id.replace(/:o$/,''));if(!it)return;
  const m=S.me,ok=canPay(it),after=it.cur==='zero'?m.zero-it.cost:m.coins-it.cost;
  openSheet(`<div style="display:flex;gap:14px;align-items:center"><div class="item" style="padding:8px;width:84px;flex:none"><div class="ic" style="height:64px">${art(it.cat)}</div></div><div><h3>${esc(it.title)}</h3><p style="margin:2px 0">${esc(it.sub)}</p></div></div>
   <div class="kv" style="grid-template-columns:1fr 1fr"><div><small>قیمت</small><b>${priceTx(it)}</b></div><div><small>موجودی بعد از خرید</small><b style="${ok?'':'color:#ff6b6b'}">${ok?fa(Math.floor(after)):'کافی نیست'}</b></div></div>
   ${ok?'':`<p style="color:#ff8a8a">${it.cur==='zero'?'زیرو کم داری؛ از دسته‌ی «زیرو» با سکه زیرو بخر.':'سکه‌ات کافی نیست؛ از «کار» و «جایزه‌ی روزانه» توی ربات سکه بگیر.'}</p>`}
   <div class="acts"><button class="ok" id="go" ${ok?'':'disabled style="opacity:.4"'}>تأیید خرید</button><button class="no" id="cls">انصراف</button></div>`);
  $('#cls').onclick=closeSheet;
  $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;b.textContent='در حال خرید…';
    try{const r=await api('api/buy',{method:'POST',body:JSON.stringify({item:id})});
      if(r.me)applyMe(r.me);if(r.shop){S.shop={...S.shop,...r.shop}}
      closeSheet();toast(r.msg,r.ok?'good':'bad');hap(r.ok?'ok':'bad');renderShop();renderMe();loadMap()}
    catch(e){closeSheet();toast('اتصال قطع شد؛ دوباره امتحان کن','bad')}};
}

/* ---------- رتبه‌ها ---------- */
function rankSnapshot(){
  if(!S.map)return;const cs=S.map.cs,by=S.rankBy,ord=[...cs].sort((a,b)=>(b[by==='score'?'s':'l']-a[by==='score'?'s':'l'])||(b.s-a.s));
  const cur={};ord.forEach((c,i)=>cur[c.n]=i+1);
  for(const n in cur){const p=S.prevRank[n];if(p&&p!==cur[n])S.moves[n]={d:p-cur[n],t:Date.now()}}
  S.prevRank=cur;S.ord=ord;
}
function renderRank(){
  const el=$('#t-rank');if(!S.map){el.innerHTML='<div class="empty">در حال بارگذاری…</div>';return}
  const by=S.rankBy,ord=S.ord||[],meN=S.me&&S.me.reg?S.me.name:null,cr=S.map.crown.i>=0?S.map.cs[S.map.crown.i].n:null;
  el.innerHTML=`<div class="seg"><button data-r="score" class="${by==='score'?'on':''}">بر اساس قدرت</button><button data-r="land" class="${by==='land'?'on':''}">بر اساس استان</button></div>`+
  ord.slice(0,60).map((c,i)=>{const mv=S.moves[c.n],fresh=mv&&Date.now()-mv.t<12000;const g=i<3?` g${i+1}`:'';
    return `<div class="row ${c.n===meN?'me':''} ${fresh?(mv.d>0?'up':'dn'):''}" data-k="${S.map.cs.indexOf(c)}"><div class="rk${g}">${fa(i+1)}</div><div class="cdot" style="background:rgb(${c.c})"></div><span style="font-size:20px">${esc(c.e)}</span>
    <div class="nm"><b>${esc(c.n)}${c.n===cr?' 👑':''}${fresh?`<span class="mv ${mv.d>0?'u':'d'}">${mv.d>0?'▲':'▼'}${fa(Math.abs(mv.d))}</span>`:''}</b><small>${c.sh?'🛡 سپر فعال · ':''}${c.npc?'🤖 NPC · ':''}${fa(c.l)} استان</small></div>
    <div class="v">${fa(by==='score'?c.s:c.l)}<small>${by==='score'?'قدرت':'استان'}</small></div></div>`}).join('');
  $$('[data-r]',el).forEach(b=>b.onclick=()=>{S.rankBy=b.dataset.r;rankSnapshot();renderRank()});
  $$('.row',el).forEach(r=>r.onclick=()=>{const k=+r.dataset.k;setTab('map');setTimeout(()=>{focusCountry(k);S.sel=k;M.dirty=true;countrySheet(k)},120)});
}

/* ---------- کشور من ---------- */
function renderMe(){
  const el=$('#t-me'),m=S.me;if(!m){el.innerHTML='<div class="empty">در حال بارگذاری…</div>';return}
  if(!m.reg){el.innerHTML=`<div class="hero"><div class="big">🏛</div><div><h2>هنوز کشور نداری</h2><small>توی ربات بنویس «ثبت نام» تا کشورت ساخته بشه و روی نقشه بیاد.</small></div></div><div class="acts"><button class="ok" onclick="tg&&tg.close()">برگشت به ربات</button></div>`;return}
  const sleft=Math.max(0,m.shield-(Date.now()/1000-m.now));
  el.innerHTML=`<div class="hero"><div class="big">${esc(m.emblem)}</div><div><h2>${esc(m.name)}</h2><small>رتبه‌ی ${fa(m.rank||'—')} از ${fa(S.map?S.map.cs.length:0)} کشور ${m.emperor?'· 👑 امپراتور':''}</small></div></div>
  <div class="stats">
   <div class="sc"><small>استان‌ها</small><b>${fa(m.land)}</b></div><div class="sc"><small>قدرت کل</small><b>${fa(m.score)}</b></div>
   <div class="sc"><small>⚡ فرمان نظامی</small><b>${fa(Math.floor(m.orders))} / ${fa(m.orders_max)}</b><div class="bar"><i style="width:${m.orders/m.orders_max*100}%"></i></div></div>
   <div class="sc"><small>🙂 رضایت مردم</small><b>${fa(m.sat)}٪</b><div class="bar"><i class="b" style="width:${m.sat}%"></i></div></div>
   <div class="sc"><small>👥 جمعیت</small><b>${fa(m.pop)}</b></div><div class="sc"><small>🛡 سپر</small><b>${sleft>0?dur(sleft):'ندارد'}</b></div>
  </div>
  ${m.emperor?'<div class="crownCard">👑 <b>تو امپراتور جهانی!</b> خراج ساعتی و فرمان اضافه می‌گیری؛ ولی همه دنبال تاجت‌ان.</div>':''}
  <div class="acts" style="margin-top:14px"><button class="ok" id="meShop">🛒 فروشگاه سپر و منابع</button><button class="no" id="meMap">🗺 کشورم روی نقشه</button></div>`;
  $('#meShop').onclick=()=>setTab('shop');$('#meMap').onclick=()=>{setTab('map');setTimeout(goMe,150)};
}
/* فروشگاه عمداً با هر تیک نقشه دوباره ساخته نمیشه (اسکرول و دکمه‌ها نمی‌پرن)؛ فقط با خرید/بازکردن تب */
function renderActive(){if(S.tab==='rank')renderRank();else if(S.tab==='me')renderMe()}

/* ---------- ناوبری ---------- */
function setTab(t){
  S.tab=t;closeSheet();$$('.tab').forEach(x=>x.classList.toggle('on',x.id==='t-'+t));$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='map'){resize();M.dirty=true}if(t==='shop'){renderShop();loadShop()}if(t==='rank'){rankSnapshot();renderRank();loadMap()}if(t==='me'){renderMe();api('api/me').then(applyMe).then(renderMe).catch(()=>{})}
  hap();
}
$$('#nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
addEventListener('resize',()=>{resize()});
if(window.ResizeObserver)new ResizeObserver(()=>resize()).observe($('#t-map'));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{M.dirty=true});

/* ---------- شروع ---------- */
requestAnimationFrame(loop);
if(!glInit()){$('#mapLoad').innerHTML='<div>دستگاه یا مرورگرت از نقشه‌ی سه‌بعدی (WebGL) پشتیبانی نمی‌کنه.<br>نسخه‌ی تلگرام رو آپدیت کن.</div>'}
else if(!INIT){$('#mapLoad').innerHTML='<div>این صفحه فقط داخل تلگرام کار می‌کنه.<br>از ربات، دستور «نقشه» رو بزن.</div>'}
else{loadMap().then(()=>{connect();loadShop()})}
</script>
</body>
</html>
